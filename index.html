<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Multiplayer - Game Keren</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🎮 TETRIS MULTIPLAYER 🎮</h1>
        
        <div class="mode-selector">
            <button id="singlePlayerBtn" class="mode-btn active">Solo</button>
            <button id="multiPlayerBtn" class="mode-btn">Multiplayer</button>
        </div>

        <div class="game-wrapper" id="gameWrapper">
            <div class="player-container">
                <div class="player-info">
                    <h2>Player 1</h2>
                    <div class="score-display">
                        <p>Score: <span id="score1">0</span></p>
                        <p>Lines: <span id="lines1">0</span></p>
                        <p>Level: <span id="level1">1</span></p>
                    </div>
                </div>
                <canvas id="gameCanvas1" width="300" height="600"></canvas>
                <div class="next-piece">
                    <p>Next:</p>
                    <canvas id="nextCanvas1" width="100" height="100"></canvas>
                </div>
            </div>

            <div class="player-container" id="player2Container" style="display:none;">
                <div class="player-info">
                    <h2>Player 2</h2>
                    <div class="score-display">
                        <p>Score: <span id="score2">0</span></p>
                        <p>Lines: <span id="lines2">0</span></p>
                        <p>Level: <span id="level2">1</span></p>
                    </div>
                </div>
                <canvas id="gameCanvas2" width="300" height="600"></canvas>
                <div class="next-piece">
                    <p>Next:</p>
                    <canvas id="nextCanvas2" width="100" height="100"></canvas>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn">START GAME</button>
            <button id="pauseBtn">PAUSE</button>
            <button id="resetBtn">RESET</button>
        </div>

        <div class="instructions">
            <h3>📋 Kontrol:</h3>
            <p><strong>Player 1:</strong> ⬅️➡️ (Arrow Keys), ⬇️ (Down), Z/X (Rotate)</p>
            <p><strong>Player 2:</strong> A/D, S, Q/E (Rotate)</p>
            <p>Penuh satu baris untuk menghapus! Dapatkan poin sebanyak mungkin! 🎉</p>
        </div>

        <!-- Particle system for effects -->
        <div id="particleContainer" class="particle-container"></div>
    </div>

    <script src="tetris.js"></script>
</body>
</html>
